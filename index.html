<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure Website</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#0078D4,#00B4FF);
            color:white;
        }

        .box{
            text-align:center;
            background:rgba(255,255,255,0.1);
            padding:40px;
            border-radius:15px;
            backdrop-filter:blur(5px);
        }

        h1{
            font-size:3rem;
            margin-bottom:10px;
        }

        p{
            font-size:1.2rem;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Website Hosted on Azure 🚀</h1>
        <p>Deployment successful using GitHub</p>
    </div>

</body>
</html>
